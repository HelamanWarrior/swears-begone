[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swears-begone"
version = "0.2.2"
description = "A CLI tool for filtering profanity from videos with Whisper"
dependencies = [
    "faster-whisper>=1.0.0",
    "srt>=3.5.0",
    "subliminal>=2.0.0"
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.0.0,<13.0.0",
    "nvidia-cudnn-cu12>=9.0.0,<10.0.0"
]

[tool.setuptools.package-data]
"swears_begone" = ["*.txt", "data/*.txt"]

[project.scripts]
swears-begone = "swears_begone.cli:main"